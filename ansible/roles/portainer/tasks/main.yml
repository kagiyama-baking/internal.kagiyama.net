---
# ===== Portainer デプロイ =====
# 前提: setup ロールで /opt/portainer がログインユーザー所有で作成済み
#       ログインユーザーは docker グループに所属済み

# compose の差分は次のタスクの state: present が再作成で反映するので、再起動のハンドラは置かない。
# 再作成の直後に再起動すると、起動時のデータ移行を中断してしまう。
- name: Docker-compose.yml を配置
  ansible.builtin.template:
      src: docker-compose.yml.j2
      dest: '{{ portainer_install_dir }}/docker-compose.yml'
      mode: '0644'

- name: Portainer コンテナを起動
  community.docker.docker_compose_v2:
      project_src: '{{ portainer_install_dir }}'
      state: present
      pull: missing
