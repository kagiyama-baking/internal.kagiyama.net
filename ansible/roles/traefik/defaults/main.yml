---
# Traefik 設定ディレクトリ
traefik_install_dir: /opt/traefik

# Docker イメージ
traefik_image: traefik:v3.6.10

# HTTP ポート
traefik_http_port: 80

# HTTPS ポート
traefik_https_port: 443

# ACME メールアドレス（Let's Encrypt 証明書取得用、vault.yml で上書き）
traefik_acme_email: ''

# Let's Encrypt ステージング環境を使用するか（初回テスト時は true 推奨）
traefik_acme_staging: false

# AWS リージョン（Route 53 DNS-01 チャレンジ用）
traefik_aws_region: ap-northeast-1

# Traefik コンテナが名前解決に使う DNS サーバ
# Docker はコンテナ作成時点のホスト /etc/resolv.conf を埋め込み DNS(127.0.0.11) の上流として固定する。
# ホスト側の値は Tailscale MagicDNS 等により変動するため、応答しない値が固定されると
# Let's Encrypt/Route 53 への接続が名前解決で失敗し、証明書の自動更新が恒久的に停止する。
# 上流を明示指定してホストの設定から切り離す（127.0.0.11 自体は維持されコンテナ名解決は不変）。
traefik_dns_servers:
    - 8.8.8.8
    - 8.8.4.4

# DNS-01 チャレンジの伝播確認に使用する DNS サーバ
# CoreDNS がシステム DNS の場合、権威 NS の自動検出が妨害されるため明示的に指定する
traefik_acme_resolvers:
    - ns-359.awsdns-44.com:53
    - ns-1015.awsdns-62.net:53
