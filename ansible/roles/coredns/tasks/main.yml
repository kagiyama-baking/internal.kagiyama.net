---
# ===== CoreDNS デプロイ =====
# 前提: setup ロールで /opt/coredns がログインユーザー所有で作成済み
#       ログインユーザーは docker グループに所属済み

- name: Vault 暗号化変数を読み込み
  ansible.builtin.include_vars:
      file: vault.yml

# compose の差分は下のタスクの state: present が再作成で反映するので、ハンドラは発火させない。
# 発火させると、再作成の直後にもう一度再起動して名前解決を 2 回止めてしまう。
- name: Docker-compose.yml を配置
  ansible.builtin.template:
      src: docker-compose.yml.j2
      dest: '{{ coredns_install_dir }}/docker-compose.yml'
      mode: '0644'

- name: Corefile を配置
  ansible.builtin.template:
      src: Corefile.j2
      dest: '{{ coredns_install_dir }}/config/Corefile'
      mode: '0644'
  notify: CoreDNS を再起動

- name: Custom.hosts を配置
  ansible.builtin.template:
      src: custom.hosts.j2
      dest: '{{ coredns_install_dir }}/config/custom.hosts'
      mode: '0644'
  notify: CoreDNS を再起動

- name: CoreDNS コンテナを起動
  community.docker.docker_compose_v2:
      project_src: '{{ coredns_install_dir }}'
      state: present
      pull: missing
