---
# 秘密値に、描画先（.autorestic.yml の二重引用符の YAML）と Ansible が解釈してしまう文字が無いことを確かめる。
# autorestic は値をシェルにも展開にも通さず restic の環境変数に渡すので、ほかのロールより範囲が狭い
# （空白 $ ' ` # は使える。restic のパスワードは vault を書き換えるだけでは作り直せないため、必要以上に止めない）。
# バケット名は保存先の URL（s3.<region>.amazonaws.com/<bucket>/backups）の一部なので、S3 のバケット名の形でなければ止める。
# 理由は README の「秘密値に使えない文字」。公開リポジトリの CI のログに残るため、値は絶対に出さない。
# 一覧はテンプレートで使う vault の値と揃える（scripts/check_docs.py の C10 が確かめる）。
- name: 使えない値の秘密値を調べる（値は表示しない）
  ansible.builtin.set_fact:
      # 文字列でない値（null・数値・真偽値）、使えない文字を含む値、形の違うバケット名の名前を集める
      backup_bad_secret_names: >-
          {{ ((backup_secrets | dict2items | rejectattr('value', 'string') | map(attribute='key') | list)
              + (backup_secrets | dict2items | selectattr('value', 'string')
                 | selectattr('value', 'search', backup_forbidden_pattern) | map(attribute='key') | list)
              + (['backup_vault_s3_bucket'] if (backup_vault_s3_bucket is string
                 and backup_vault_s3_bucket is not match(backup_bucket_pattern)) else [])) | unique }}
  vars:
      backup_forbidden_pattern: '^$|["\\{}\r\n]'
      backup_bucket_pattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
      # 値は生のまま並べる（"{{ x }}" で文字列にすると null が 'None' になって素通りする）
      backup_secrets: >-
          {{ {'backup_vault_s3_bucket': backup_vault_s3_bucket,
              'backup_vault_aws_access_key_id': backup_vault_aws_access_key_id,
              'backup_vault_aws_secret_access_key': backup_vault_aws_secret_access_key,
              'backup_vault_restic_password': backup_vault_restic_password} }}
  no_log: true

- name: 秘密値に使えない値が無いこと
  ansible.builtin.assert:
      that: backup_bad_secret_names | length == 0
      fail_msg: >-
          空・文字列でない・使えない文字（" \ { } と改行）を含む、または S3 のバケット名の形でない秘密値:
          {{ backup_bad_secret_names | join(', ') }}。README の「秘密値に使えない文字」を参照
      quiet: true
