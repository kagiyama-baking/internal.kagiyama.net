---
# 秘密値に、compose・YAML・env ファイル・シェル・Ansible のどれかが解釈してしまう文字が無いことを確かめる。
# 値はエスケープせずにそのまま書き出すので、使えない文字はここで止める（理由は README の「秘密値に使えない文字」）。
# 公開リポジトリの CI のログに残るため、値は絶対に出さない（値を扱うタスクは no_log、止めるときは変数名だけ）。
- name: 使えない文字を含む秘密値を調べる（値は表示しない）
  ansible.builtin.set_fact:
      langfuse_bad_secret_names: >-
          {{ langfuse_secrets | dict2items
             | selectattr('value', 'search', langfuse_forbidden_pattern)
             | map(attribute='key') | list }}
  vars:
      langfuse_forbidden_pattern: '^$|[\s$"''`\\#{}]'
      langfuse_secrets:
          langfuse_vault_nextauth_secret: "{{ langfuse_vault_nextauth_secret }}"
          langfuse_vault_salt: "{{ langfuse_vault_salt }}"
          langfuse_vault_encryption_key: "{{ langfuse_vault_encryption_key }}"
          langfuse_vault_db_password: "{{ langfuse_vault_db_password }}"
          langfuse_vault_clickhouse_password: "{{ langfuse_vault_clickhouse_password }}"
          langfuse_vault_redis_password: "{{ langfuse_vault_redis_password }}"
          langfuse_vault_s3_access_key_id: "{{ langfuse_vault_s3_access_key_id }}"
          langfuse_vault_s3_secret_access_key: "{{ langfuse_vault_s3_secret_access_key }}"
  no_log: true

- name: 秘密値に使えない文字が無いこと
  ansible.builtin.assert:
      that: langfuse_bad_secret_names | length == 0
      fail_msg: >-
          使えない文字（空白 $ " ' ` \ # { }）を含むか空の秘密値: {{ langfuse_bad_secret_names | join(', ') }}。
          README の「秘密値に使えない文字」を参照
      quiet: true
