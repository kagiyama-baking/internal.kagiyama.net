---
# ===== LangFuse v3 デプロイ =====
# 前提: setup ロールで /opt/langfuse がログインユーザー所有で作成済み
#       ログインユーザーは docker グループに所属済み

- name: Vault 暗号化変数を読み込み
  ansible.builtin.include_vars:
      file: vault.yml

- name: 秘密値の文字を確かめる
  ansible.builtin.import_tasks: secrets_check.yml

# ClickHouse 設定ディレクトリ（config.d / users.d のドロップイン設定用）
- name: ClickHouse 設定ディレクトリを作成
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: '0755'
  loop:
      - "{{ langfuse_install_dir }}/clickhouse-config/config.d"
      - "{{ langfuse_install_dir }}/clickhouse-config/users.d"

- name: ClickHouse サーバーメモリ設定を配置
  ansible.builtin.template:
      src: clickhouse/config.d/memory.xml.j2
      dest: "{{ langfuse_install_dir }}/clickhouse-config/config.d/memory.xml"
      mode: '0644'
  notify: LangFuse を再起動

- name: ClickHouse システムテーブル TTL 設定を配置
  ansible.builtin.template:
      src: clickhouse/config.d/logging.xml.j2
      dest: "{{ langfuse_install_dir }}/clickhouse-config/config.d/logging.xml"
      mode: '0644'
  notify: LangFuse を再起動

- name: ClickHouse ユーザーメモリ制限を配置
  ansible.builtin.template:
      src: clickhouse/users.d/memory.xml.j2
      dest: "{{ langfuse_install_dir }}/clickhouse-config/users.d/memory.xml"
      mode: '0644'
  notify: LangFuse を再起動

- name: 環境変数ファイルを配置
  ansible.builtin.template:
      src: env.j2
      dest: '{{ langfuse_install_dir }}/.env'
      mode: '0600'
  notify: LangFuse を再起動

# compose の差分は次のタスクの state: present が再作成で反映するので、ハンドラは発火させない。
# 発火させると、再作成の直後に起動時 migration の途中で全コンテナを再起動してしまう。
- name: Docker-compose.yml を配置
  ansible.builtin.template:
      src: docker-compose.yml.j2
      dest: '{{ langfuse_install_dir }}/docker-compose.yml'
      mode: '0600'

# Redis は永続化しないので、作り直すとキューが消え、worker は再起動するまで接続のタイムアウトを出し続ける。
# 起動タスクの前後で Redis のコンテナの ID と起動時刻を比べ、変わっていたら worker だけを再起動する
# （compose の出力の読み取りに頼らず、Docker の情報で比べる）
- name: Redis のコンテナを調べる（起動前）
  community.docker.docker_container_info:
      name: langfuse-redis
  register: langfuse_redis_before

- name: LangFuse コンテナを起動
  community.docker.docker_compose_v2:
      project_src: '{{ langfuse_install_dir }}'
      state: present
      pull: missing

- name: Redis のコンテナを調べる（起動後）
  community.docker.docker_container_info:
      name: langfuse-redis
  register: langfuse_redis_after

- name: Redis を作り直したら worker を再起動する
  community.docker.docker_compose_v2:
      project_src: '{{ langfuse_install_dir }}'
      services:
          - langfuse-worker
      state: restarted
  # 作り直し（ID）と再起動（起動時刻）のどちらでも worker を再起動する。初回で Redis が無かった場合も再起動になる（無害）
  when: >-
      ((langfuse_redis_before.container | default({}, true)).get('Id', ''),
       (langfuse_redis_before.container | default({}, true)).get('State', {}).get('StartedAt', ''))
      != ((langfuse_redis_after.container | default({}, true)).get('Id', ''),
       (langfuse_redis_after.container | default({}, true)).get('State', {}).get('StartedAt', ''))
