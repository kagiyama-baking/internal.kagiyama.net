---
# ===== LangFuse v3 デプロイ =====
# 前提: setup ロールで /opt/langfuse がログインユーザー所有で作成済み
#       ログインユーザーは docker グループに所属済み

- name: Vault 暗号化変数を読み込み
  ansible.builtin.include_vars:
      file: vault.yml

- name: 秘密値の文字を確かめる
  ansible.builtin.import_tasks: secrets_check.yml

# ClickHouse 設定ディレクトリ（config.d / users.d のドロップイン設定用）
- name: ClickHouse 設定ディレクトリを作成
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: '0755'
  loop:
      - "{{ langfuse_install_dir }}/clickhouse-config/config.d"
      - "{{ langfuse_install_dir }}/clickhouse-config/users.d"

- name: ClickHouse サーバーメモリ設定を配置
  ansible.builtin.template:
      src: clickhouse/config.d/memory.xml.j2
      dest: "{{ langfuse_install_dir }}/clickhouse-config/config.d/memory.xml"
      mode: '0644'
  notify: LangFuse を再起動

- name: ClickHouse システムテーブル TTL 設定を配置
  ansible.builtin.template:
      src: clickhouse/config.d/logging.xml.j2
      dest: "{{ langfuse_install_dir }}/clickhouse-config/config.d/logging.xml"
      mode: '0644'
  notify: LangFuse を再起動

- name: ClickHouse ユーザーメモリ制限を配置
  ansible.builtin.template:
      src: clickhouse/users.d/memory.xml.j2
      dest: "{{ langfuse_install_dir }}/clickhouse-config/users.d/memory.xml"
      mode: '0644'
  notify: LangFuse を再起動

- name: 環境変数ファイルを配置
  ansible.builtin.template:
      src: env.j2
      dest: '{{ langfuse_install_dir }}/.env'
      mode: '0600'
  notify: LangFuse を再起動

# compose の差分は次のタスクの state: present が再作成で反映するので、ハンドラは発火させない。
# 発火させると、再作成の直後に起動時 migration の途中で全コンテナを再起動してしまう。
- name: Docker-compose.yml を配置
  ansible.builtin.template:
      src: docker-compose.yml.j2
      dest: '{{ langfuse_install_dir }}/docker-compose.yml'
      mode: '0600'

# 起動タスクの結果（失敗したときも）にはコンテナの起動コマンドが載り、Redis の --requirepass のパスワードが
# 公開の CI のログに出る。起動タスク・コンテナを調べるタスク・ハンドラは no_log にする（README の「運用上の注意」）
- name: LangFuse コンテナを起動
  community.docker.docker_compose_v2:
      project_src: '{{ langfuse_install_dir }}'
      state: present
      pull: missing
  no_log: true

# worker は Redis が作り直されたり再起動したりすると接続が戻らず、30 秒ごとにタイムアウトを出し続ける。
# 起動タスクのあとで Redis が worker より後に起動していたら、ハンドラで worker だけを再起動する。
# 前回の状態を覚えずに今の起動時刻だけで比べるので、途中で失敗しても次のデプロイで直る
- name: Redis のコンテナを調べる
  community.docker.docker_container_info:
      name: langfuse-redis
  register: langfuse_redis_info
  no_log: true

- name: LangFuse の worker のコンテナを調べる
  community.docker.docker_container_info:
      name: langfuse-worker
  register: langfuse_worker_info
  no_log: true

- name: Redis が worker より後に起動していたら worker の再起動を予約する
  ansible.builtin.debug:
      msg: Redis が worker より後に起動しているので、ハンドラで worker を再起動する
  changed_when: true
  notify: LangFuse の worker を再起動
  # 起動時刻は秒までで比べる（Docker の時刻は小数部の桁が揃わず、文字列のままでは正しく比べられない）
  when: >-
      ((langfuse_redis_info.container | default({}, true)).get('State', {}).get('StartedAt', '') | string)[:19]
      > ((langfuse_worker_info.container | default({}, true)).get('State', {}).get('StartedAt', '') | string)[:19]
