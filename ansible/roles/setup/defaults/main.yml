---
# Docker デーモン設定（/etc/docker/daemon.json として配置）
#
# dns を明示指定する理由:
# Docker はコンテナ作成時点のホスト /etc/resolv.conf を、埋め込み DNS(127.0.0.11) の
# 上流として固定的に埋め込む。ホスト側の値は Tailscale MagicDNS 等により変動するため、
# 応答しない値を掴んだコンテナは外部名前解決が恒久的に失敗する（PR #112 の Traefik 障害）。
# デーモン側で上流を固定し、以後作成される全コンテナをホスト設定の変動から切り離す。
# コンテナ内の nameserver は 127.0.0.11 のまま維持されるため、コンテナ名解決には影響しない。
setup_docker_daemon_config:
    dns:
        - 8.8.8.8
        - 8.8.4.4
