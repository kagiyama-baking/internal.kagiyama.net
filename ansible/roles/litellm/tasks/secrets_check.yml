---
# 秘密値に、compose・YAML・シェル・Ansible のどれかが解釈してしまう文字が無いことを確かめる。
# 値はエスケープせずにそのまま書き出すので、使えない文字はここで止める（理由は README の「秘密値に使えない文字」）。
# 公開リポジトリの CI のログに残るため、値は絶対に出さない（値を扱うタスクは no_log、止めるときは変数名だけ）。
- name: 使えない文字を含む秘密値を調べる（値は表示しない）
  ansible.builtin.set_fact:
      litellm_bad_secret_names: >-
          {{ litellm_secrets | dict2items
             | selectattr('value', 'search', litellm_forbidden_pattern)
             | map(attribute='key') | list }}
  vars:
      litellm_forbidden_pattern: '^$|[\s$"''`\\#{}]'
      litellm_secrets:
          litellm_vault_master_key: "{{ litellm_vault_master_key }}"
          litellm_vault_db_password: "{{ litellm_vault_db_password }}"
          litellm_vault_langfuse_public_key: "{{ litellm_vault_langfuse_public_key }}"
          litellm_vault_langfuse_secret_key: "{{ litellm_vault_langfuse_secret_key }}"
  no_log: true

- name: 秘密値に使えない文字が無いこと
  ansible.builtin.assert:
      that: litellm_bad_secret_names | length == 0
      fail_msg: >-
          使えない文字（空白 $ " ' ` \ # { }）を含むか空の秘密値: {{ litellm_bad_secret_names | join(', ') }}。
          README の「秘密値に使えない文字」を参照
      quiet: true
