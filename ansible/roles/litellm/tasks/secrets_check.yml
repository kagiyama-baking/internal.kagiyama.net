---
# 秘密値に、compose・YAML・シェル・Ansible のどれかが解釈してしまう文字が無いことを確かめる。
# 値はエスケープせずにそのまま書き出すので、使えない値はここで止める（理由は README の「秘密値に使えない文字」）。
# 公開リポジトリの CI のログに残るため、値は絶対に出さない（値を扱うタスクは no_log、止めるときは変数名だけ）。
# 一覧はテンプレートで使う vault の値と揃える（scripts/check_docs.py の C10 が確かめる）。
- name: 使えない値の秘密値を調べる（値は表示しない）
  ansible.builtin.set_fact:
      # 文字列でない値（null・数値・真偽値。引用符なしの YAML が変える）と、使えない文字を含む文字列の名前を集める
      litellm_bad_secret_names: >-
          {{ (litellm_secrets | dict2items | rejectattr('value', 'string') | map(attribute='key') | list)
             + (litellm_secrets | dict2items | selectattr('value', 'string')
                | selectattr('value', 'search', litellm_forbidden_pattern) | map(attribute='key') | list) }}
  vars:
      litellm_forbidden_pattern: '^$|[\s$"''`\\#{}]'
      # 値は生のまま並べる（"{{ x }}" で文字列にすると null が 'None' になって素通りする）
      litellm_secrets: >-
          {{ {'litellm_vault_master_key': litellm_vault_master_key,
              'litellm_vault_db_password': litellm_vault_db_password,
              'litellm_vault_langfuse_public_key': litellm_vault_langfuse_public_key,
              'litellm_vault_langfuse_secret_key': litellm_vault_langfuse_secret_key} }}
  no_log: true

- name: 秘密値に使えない値が無いこと
  ansible.builtin.assert:
      that: litellm_bad_secret_names | length == 0
      fail_msg: >-
          空・文字列でない・使えない文字（空白 $ " ' ` \ # { }）を含む秘密値: {{ litellm_bad_secret_names | join(', ') }}。
          README の「秘密値に使えない文字」を参照
      quiet: true
