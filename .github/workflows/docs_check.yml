---
name: Docs Check

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - 'README.md'
            - 'CLAUDE.md'
            - 'docs/**'
            - '.claude/**'
            - '.kiro/**'
            - 'ansible/**'
            - 'tofu/**'
            - 'Makefile'
            - 'scripts/**'
            - '.github/workflows/deploy.yml'
            - '.github/workflows/docs_check.yml'

jobs:
    docs-check:
        name: docs-check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Run docs consistency check
              run: python scripts/check_docs.py
